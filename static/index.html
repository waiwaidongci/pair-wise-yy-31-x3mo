<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>车辆召回跟踪</title><style>body{font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 20px}pre{background:#f3f5f7;padding:16px;overflow:auto}button{padding:8px 14px}.card{border:1px solid #ddd;border-radius:8px;padding:12px 16px;margin:12px 0}.tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:13px}.pending{background:#fff3cd}.approved{background:#d4edda}.rejected{background:#f8d7da}table{border-collapse:collapse;margin-top:8px}th,td{border:1px solid #ccc;padding:4px 10px;font-size:14px;text-align:left;vertical-align:top}</style><h1>车辆安全召回与修复跟踪</h1><p>召回范围按版本发布；范围修正需监管审核：通过前原范围照常执行，通过后新增车辆进入通知和上报队列，移出车辆的未完成通知撤销，已确认维修保留。</p><button onclick="loadState()">刷新状态</button><h2>范围修正（待审范围 / 差异 / 处置结果）</h2><div id="amendments">加载中...</div><h2>原始状态</h2><pre id="state">加载中...</pre><script>
const STATUS={pending:"待审核",approved:"已通过",rejected:"已驳回"};
const KEY_NAME={models:"车型",model_years:"年款",vin_prefixes:"VIN 前缀",countries:"国家"};
function fieldDiff(fields){return Object.entries(fields).map(([k,v])=>{const p=[];if(v.added.length)p.push("新增 "+v.added.join(", "));if(v.removed.length)p.push("移除 "+v.removed.join(", "));return p.length?(KEY_NAME[k]||k)+"："+p.join("；"):null}).filter(Boolean).join("<br>")||"无字段变化"}
function renderAmendments(list){if(!list.length)return "<p>暂无范围修正。</p>";return list.map(a=>{const d=a.diff||{};const disp=a.disposition?`<tr><th>处置结果</th><td>新增车辆 ${disp.added_vins.join(", ")||"无"}（补发通知 ${disp.notifications_created} 条）；移出车辆 ${disp.removed_vins.join(", ")||"无"}（撤销未完成通知 ${disp.notifications_revoked} 条，保留已确认维修 ${disp.confirmed_repairs_retained} 条）；上报单 #${disp.report_id}，生效范围版本 v${disp.scope_version}</td></tr>`:"";return `<div class="card"><span class="tag ${a.status}">${STATUS[a.status]||a.status}</span> <b>修正 #${a.id}</b>（召回 #${a.recall_id}，v${a.base_scope_version} → v${a.target_scope_version}，提交人 ${a.submitted_by}）<table><tr><th>原因</th><td>${a.reason}</td></tr><tr><th>待审范围</th><td>${JSON.stringify(a.scope)}</td></tr><tr><th>字段差异</th><td>${fieldDiff(d.fields||{})}</td></tr><tr><th>车辆差异</th><td>新增 ${(d.added_vins||[]).join(", ")||"无"}；移出 ${(d.removed_vins||[]).join(", ")||"无"}</td></tr>${a.review_note?`<tr><th>审核意见</th><td>${a.reviewed_by}：${a.review_note}</td></tr>`:""}${disp}</table></div>`}).join("")}
async function loadState(){const s=await (await fetch('/api/state')).json();amendments.innerHTML=renderAmendments(s.amendments||[]);state.textContent=JSON.stringify(s,null,2)}loadState()
</script></html>
